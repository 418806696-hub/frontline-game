<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代号：前线 3.0</title><style>body{margin:0;overflow:hidden;background:#121c25;color:#fff;font:16px system-ui}canvas{display:block}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#111b28db;z-index:4}article{max-width:480px;padding:36px;border:1px solid #8096a5;background:#182938}h1{font-size:42px;margin:0;color:#f1d39a}button{padding:14px 28px;background:#eac181;border:0;font-weight:bold;font-size:18px;cursor:pointer}#hud{position:fixed;inset:20px;pointer-events:none;text-shadow:0 2px 4px #000}#bottom{position:absolute;bottom:0;font-size:24px}#right{position:absolute;right:0;top:0;text-align:right}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font:26px monospace}#tip{position:fixed;top:18%;width:100%;text-align:center;color:#ffe09b}#map{position:absolute;right:0;bottom:0;border:1px solid #aaa}small{color:#b6c5ce} </style><div id="menu"><article><small>FRONTLINE / MULTIPLAYER PROTOTYPE</small><h1>代号：前线 3.0</h1><p>3D 生存训练场 · 多人同房 · 武器拾取 · 安全区</p><p>WASD 移动 / 空格跳跃 / Shift 奔跑 / 鼠标射击 / R 换弹 / 1–3 切枪 / E 拾取 / Esc 暂停</p><p id="status">连接服务器中……</p><button id="play" disabled>进入战场</button></article></div><div id="hud"><div id="top"></div><div id="right"></div><div id="bottom"></div><canvas id="map" width="150" height="150"></canvas></div><div id="cross">+</div><div id="tip"></div><script type="module">
import * as T from '/three.js';
const $=id=>document.getElementById(id),scene=new T.Scene();scene.background=new T.Color(0xa4c5d3);scene.fog=new T.Fog(0xa4c5d3,48,140);const cam=new T.PerspectiveCamera(75,innerWidth/innerHeight,.05,200),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xe7f5ff,0x77785c,2));const sun=new T.DirectionalLight(0xffe0a8,2);sun.position.set(30,60,20);scene.add(sun);function cube(w,h,d,c,x,y,z,parent=scene){let o=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:c}));o.position.set(x,y,z);parent.add(o);return o}cube(140,.2,140,0x72866a,0,-.1,0);let grid=new T.GridHelper(140,70,0x65765e,0x899982);grid.position.y=.015;scene.add(grid);const ring=new T.Mesh(new T.RingGeometry(.99,1,128),new T.MeshBasicMaterial({color:0x39a9ff,side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.05;scene.add(ring);let boxes=[],me=null,id,players=[],loot=[],radius=65,models=new Map(),items=new Map(),yaw=0,pitch=0,vy=0,pos=new T.Vector3(),keys={},last=performance.now(),lastMove=0,lastShot=0,fire=false,started=false,dead=false;const names=['半自动步枪','冲锋枪','狙击步枪','医疗包'],colors=[0xd9ba71,0x60d2ad,0xbba0ff,0xff6666],delay=[300,115,900];const gun=new T.Group();cam.add(gun);scene.add(cam);function drawGun(g){gun.clear();cube(.13,.15,g===2?.65:.43,0x26313a,.25,-.22,-.45,gun);cube(.055,.055,.4,0x141a20,.25,-.20,-.85,gun);cube(.11,.2,.13,0x3b403b,.25,-.35,-.43,gun);cube(.10,.06,.13,colors[g],.25,-.12,-.48,gun);if(g===2)cube(.12,.12,.25,0x222222,.25,-.08,-.56,gun)}drawGun(0);let shownGun=0;function person(){let g=new T.Group();cube(.65,.8,.34,0x486449,0,1.05,0,g);cube(.38,.38,.38,0xc29b79,0,1.65,0,g);cube(.43,.16,.43,0x263b37,0,1.83,0,g);for(let s of [-1,1]){cube(.21,.65,.23,0x293a42,s*.18,.33,0,g);cube(.19,.62,.22,0x657e58,s*.43,1.02,0,g)}cube(.16,.13,.65,0x202830,.4,1.03,-.3,g);scene.add(g);return g}
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);function send(o){if(ws.readyState===1)ws.send(JSON.stringify(o))}ws.onclose=()=>{$('status').textContent='服务器连接已断开，请刷新页面';$('play').disabled=true;document.exitPointerLock();$('menu').style.display='grid'};ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='init'){id=m.id;boxes=m.boxes;for(let [x,z,w,h,d] of boxes){cube(w,h,d,0x9d9785,x,h/2,z);cube(w+.2,.16,d+.2,0x6b6b63,x,h,z)}$('status').textContent='服务器已连接';$('play').disabled=false}if(m.type==='state'){players=m.players;loot=m.loot;radius=m.r;let p=players.find(p=>p.id===id);if(p){if(!me||(!me.hp&&p.hp)){pos.set(p.x,p.y,p.z);vy=0;dead=false}me=p;if(me.gun!==shownGun){shownGun=me.gun;drawGun(shownGun)}if(!p.hp&&!dead){dead=true;document.exitPointerLock();$('menu').style.display='grid';$('status').textContent='已被淘汰，点击重新部署';$('play').textContent='重新部署'}}}if(m.type==='hit'){$('cross').style.color='#ff5544';setTimeout(()=>$('cross').style.color='white',120)}};
$('play').onclick=()=>{if(dead)send({type:'respawn'});started=true;renderer.domElement.requestPointerLock()};document.addEventListener('pointerlockchange',()=>{$('menu').style.display=document.pointerLockElement?'none':'grid';fire=false;keys={}});document.addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*.002;pitch=Math.max(-1.45,Math.min(1.45,pitch-e.movementY*.002))}});document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();if(e.code==='KeyR')send({type:'reload'});if(/^Digit[123]$/.test(e.code))send({type:'gun',gun:+e.code.slice(-1)-1});if(e.code==='KeyE'){let l=loot.find(l=>l.active&&Math.hypot(l.x-pos.x,l.z-pos.z)<2.8);if(l)send({type:'loot',id:l.id})}});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('mousedown',e=>{if(e.button===0&&document.pointerLockElement)fire=true});document.addEventListener('mouseup',()=>fire=false);window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function blocked(x,z){return Math.abs(x)>68||Math.abs(z)>68||boxes.some(([a,b,w,h,d])=>Math.abs(x-a)<w/2+.4&&Math.abs(z-b)<d/2+.4)}
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if(me&&me.hp&&document.pointerLockElement){let f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),n=Math.hypot(f,s)||1,v=(keys.ShiftLeft?9:5.5)*dt/n;let dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*v,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*v;if(!blocked(pos.x+dx,pos.z))pos.x+=dx;if(!blocked(pos.x,pos.z+dz))pos.z+=dz;if(keys.Space&&pos.y<=.001)vy=7.3;vy-=19*dt;pos.y=Math.max(0,pos.y+vy*dt);if(pos.y===0)vy=0;cam.position.set(pos.x,pos.y+1.65,pos.z);cam.rotation.set(pitch,yaw,0,'YXZ');if(now-lastMove>45){send({type:'move',x:pos.x,y:pos.y,z:pos.z,a:yaw});lastMove=now}if(fire&&now-lastShot>=delay[me.gun]&&me.ammo[me.gun]>0&&Date.now()>=me.reload){let d=cam.getWorldDirection(new T.Vector3());send({type:'shoot',dx:d.x,dy:d.y,dz:d.z});lastShot=now;gun.position.z=.07}gun.position.z*=.82}ring.scale.setScalar(radius);for(let p of players){if(p.id===id)continue;let g=models.get(p.id);if(!g){g=person();models.set(p.id,g)}g.visible=p.hp>0;g.position.set(p.x,p.y,p.z);g.rotation.y=p.a||0}for(let [i,g] of models)if(!players.some(p=>p.id===i)){scene.remove(g);models.delete(i)}for(let l of loot){let g=items.get(l.id);if(!g){g=cube(.65,.32,.65,colors[l.type],l.x,.3,l.z);items.set(l.id,g)}g.visible=l.active;g.rotation.y=now*.001;g.position.y=.4+Math.sin(now*.003+l.id)*.12}if(me){$('top').textContent='生命 '+Math.ceil(me.hp)+' / 100　击杀 '+me.k;$('right').textContent='在线 '+players.length+' 人　安全区 '+Math.ceil(radius)+'m';$('bottom').textContent=names[me.gun]+'　'+me.ammo[me.gun]+' 发　|　已拥有 '+me.owned.map(g=>g+1).join(' / ');let l=loot.find(l=>l.active&&Math.hypot(l.x-pos.x,l.z-pos.z)<2.8);$('tip').textContent=Math.hypot(pos.x,pos.z)>radius?'⚠ 已离开安全区':l?'E 拾取 '+names[l.type]:Date.now()<me.reload?'换弹中…':'';let c=$('map').getContext('2d');c.fillStyle='#223c34';c.fillRect(0,0,150,150);let scale=150/140;c.strokeStyle='#65bfff';c.beginPath();c.arc(75,75,radius*scale,0,7);c.stroke();c.fillStyle='#a8a397';for(let [x,z,w,h,d] of boxes)c.fillRect(75+(x-w/2)*scale,75+(z-d/2)*scale,w*scale,d*scale);c.fillStyle='white';c.fillRect(73+pos.x*scale,73+pos.z*scale,4,4)}renderer.render(scene,cam)}requestAnimationFrame(frame);
</script></html>
